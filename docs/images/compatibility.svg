  .card { fill: var(--bg); stroke: var(--line); }
  .rule { stroke: var(--line); }
  .band { fill: var(--band); }
  .head { fill: var(--head); }
  .full { fill: var(--full); }
  .part { fill: var(--part); }
  .part-ring { fill: none; stroke: var(--part); stroke-width: 1.5; }
  .none { fill: none; stroke: var(--none); stroke-width: 1.5; }
</style>

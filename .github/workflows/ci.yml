name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    # Pull requests from forks get no secrets, so they cannot run it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        run: |
          for i in 1 2 3 4; do
            if npm install -g @anthropic-ai/claude-code && claude --version; then
              exit 0
            fi
            sleep $((i * 4))
          done
          echo "Claude Code install failed after retries"
          exit 1
      - name: Install Grok Build
        env:
          GROK_VERSION: 1.0.34
        run: |
          for i in 1 2 3 4; do
            if curl -fsSL https://x.ai/cli/install.sh | bash -s "$GROK_VERSION" && "$HOME/.grok/bin/grok" --version; then
              echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep $((i * 4))
          done
          echo "Grok Build install failed after retries"
          exit 1
      - name: Install Codex CLI
        run: |
          for i in 1 2 3 4; do
            if npm install -g @openai/codex && codex --version; then
              exit 0
            fi
            sleep $((i * 4))
          done
          echo "Codex CLI install failed after retries"
          exit 1
      - name: Live e2e
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AYA_LIVE: '1'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is missing"
            exit 1
          fi
          npm run test:e2e
